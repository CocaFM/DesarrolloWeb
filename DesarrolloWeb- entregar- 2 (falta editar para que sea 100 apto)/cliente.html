<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente - CyberCaté</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-cliente layout-panel" x-data="clienteApp()" x-cloak>

    <header class="cabecera-dashboard">
        <div class="cabecera-izquierda">
            <button x-show="vista !== 'menu'" @click="volverAlMenu()" class="btn-atras" title="Volver al menú principal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icono-casa" style="width: 24px; height: 24px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </button>
            <h1 class="cabecera-titulo">Cliente<span class="ruta-pequena" x-text="tituloRuta"></span></h1>
        </div>
        <div class="cabecera-derecha perfil-contenedor" @click.outside="menuPerfil = false">
            <button type="button" class="btn-perfil" @click="menuPerfil = !menuPerfil" x-text="inicialPerfil" title="Perfil de Usuario"></button>
            <div class="menu-desplegable" x-show="menuPerfil" style="display: none;" x-transition>
                <button type="button" @click="irConfiguraciones()">Configuraciones</button>
                <button type="button" @click="cerrarSesion()">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main class="contenido-panel" x-show="vista === 'menu'">
        <div class="grilla-botones" style="grid-template-columns: 1fr; max-width: 350px; margin: 40px auto;">
            <div class="item-grilla" style="text-align: center;">
                <button class="btn-consultar-registro" @click="abrirSeccion('sec-agendar-hora', 'Agendar Hora')"></button>
                <p>Agendar Hora</p>
            </div>
        </div>
    </main>

    <section class="contenido-panel seccion-funcional" x-show="vista === 'sec-agendar-hora'" style="display: none;">
        <div class="tarjeta-trabajo" style="max-width: 650px; margin: 0 auto;">
            <h2>Reserva tu espacio</h2>
            <form @submit.prevent="confirmarReserva">
                <label>Tu Nombre Completo:</label>
                <input type="text" x-model="reserva.nombre" required placeholder="Ej. María López">

                <label>Fecha y Hora de la Reserva:</label>
                <input type="datetime-local" id="fecha-reserva" x-model="reserva.fecha" required>
                
                <label>Cantidad de horas de uso:</label>
                <input type="number" id="horas-reserva" x-model.number="reserva.horas" required min="1">
                
                <label>Acompañante Principal:</label>
                <select id="gato-reserva-cli" x-model="reserva.gato">
                    <option value="">Sin acompañante</option>
                    <template x-for="gato in gatosDisponibles" :key="gato.id">
                        <option :value="gato.nombre" x-text="`${gato.nombre} (${gato.tipo})`"></option>
                    </template>
                </select>

                <label>Precio Total Estimado ($):</label>
                <input type="number" id="monto-reserva" :value="montoEstimado" required readonly style="background-color: #f4f6f8; color: #333; font-weight: bold;">

                <div class="espacio-botones"><button type="submit" style="background-color: #2ecc71;">Confirmar Reserva</button></div>
            </form>
        </div>
    </section>

    <!-- MODAL DE CONFIGURACIÓN (PERFIL) -->
    <div class="modal-perfil" x-show="modalPerfil" style="display: none;">
        <div class="modal-perfil-contenido" @click.outside="modalPerfil = false">
            <h3>Información de la Cuenta</h3>
            
            <div class="info-row">
                <div class="info-label">Rol:</div>
                <div class="info-value" style="font-weight: bold; color: #4b3f72; text-transform: uppercase;" x-text="datosPerfil.rol"></div>
            </div>

            <div class="info-row">
                <div class="info-label">Nombre:</div>
                <input type="text" class="info-value" x-model="datosPerfil.nombre" readonly>
                <button type="button" class="btn-copiar" @click="navigator.clipboard.writeText(datosPerfil.nombre); alert('Nombre copiado')">Copiar</button>
            </div>

            <div class="info-row">
                <div class="info-label">Correo:</div>
                <input type="text" class="info-value" x-model="datosPerfil.correo" readonly>
                <button type="button" class="btn-copiar" @click="navigator.clipboard.writeText(datosPerfil.correo); alert('Correo copiado')">Copiar</button>
            </div>
            
            <div class="info-row">
                <div class="info-label">ID Único:</div>
                <input type="text" class="info-value" x-model="datosPerfil.id" readonly>
                <button type="button" class="btn-copiar" @click="navigator.clipboard.writeText(datosPerfil.id); alert('ID copiado')">Copiar</button>
            </div>

            <div style="text-align: right; margin-top: 25px;">
                <button type="button" class="btn-secundario" style="width: auto !important; padding: 10px 20px;" @click="modalPerfil = false">Cerrar Ventana</button>
            </div>
        </div>
    </div>
    
    <script src="script_cliente.js"></script>
</body>
</html>
