<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente - CyberCaté</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cliente layout-panel">

    <!-- ========================================== -->
    <!-- 1. CABECERA Y MENÚ                         -->
    <!-- ========================================== -->
    <header class="cabecera-dashboard">
        <div class="cabecera-izquierda">
            <button id="btn-volver" class="btn-atras oculto" onclick="volverAlMenu()" title="Volver al menú principal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icono-casa" style="width: 24px; height: 24px; margin-top: 4px;">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </button>
            <h1 class="cabecera-titulo">Cliente<span id="texto-ruta" class="ruta-pequena"></span></h1>
        </div>
        <div class="cabecera-derecha perfil-contenedor">
            <button class="btn-perfil" onclick="toggleMenuPerfil()">C</button>
            <div id="menu-perfil" class="menu-desplegable">
                <button onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main id="menu-principal-cliente" class="contenido-panel activo">
        <div class="grilla-botones" style="grid-template-columns: 1fr; max-width: 350px; margin: 50px auto;">
            <div class="item-grilla" style="text-align: center;">
                <button class="btn-consultar-registro" onclick="abrirSeccion('sec-agendar-hora', 'Agendar Hora')"></button>
                <p>Agendar Hora</p>
            </div>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- 2. FORMULARIO DE RESERVA                   -->
    <!-- ========================================== -->
    <section id="sec-agendar-hora" class="contenido-panel seccion-funcional oculto">
        <div class="tarjeta-trabajo" style="max-width: 600px; margin: 0 auto;">
            <h2>Reserva tu espacio</h2>
            <p style="margin-bottom: 20px; color: #ddd;">Elige la fecha, horas de uso y a tu acompañante principal.</p>
            
            <form id="form-reserva-cliente" onsubmit="confirmarReserva(event)">
                <label>Tu Nombre Completo:</label>
                <input type="text" id="nombre-reserva-cli" required placeholder="Ej. María López" style="width: 100% !important;">

                <label>Fecha y Hora de la Reserva:</label>
                <input type="datetime-local" id="fecha-reserva" required style="width: 100% !important;">
                
                <label>Cantidad de horas de uso (<span id="txt-precio-hora" style="color: #2ecc71;"></span>):</label>
                <input type="number" id="horas-reserva" required min="1" placeholder="Ej. 2" style="width: 100% !important;">
                
                <label>Acompañante Principal (<span id="txt-precio-gato-base" style="color: #2ecc71;"></span>):</label>
                <select id="gato-reserva-cli" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 25px; border-radius: 5px; cursor: pointer;">
                    <option value="">Sin acompañante</option>
                    <!-- Las opciones se cargarán desde la BD -->
                </select>

                <label>Precio Total Estimado ($):</label>
                <input type="number" id="monto-reserva" required min="0" placeholder="Calculado automáticamente" style="background-color: #f4f6f8; color: #333; font-weight: bold; width: 100% !important;" readonly>

                <div class="espacio-botones">
                    <button type="submit" style="background-color: #2ecc71; font-weight: bold; font-size: 16px;">Confirmar Reserva</button>
                </div>
            </form>
        </div>
    </section>

    <script src="script_cliente.js"></script>
</body>
</html>
