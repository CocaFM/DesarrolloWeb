            <h1 class="cabecera-titulo">Admin</h1>

        <div class="cabecera-derecha perfil-contenedor">
            <!-- Botón redondo -->
            <button class="btn-perfil" onclick="toggleMenuPerfil()">A</button>

            <div id="menu-perfil" class="menu-desplegable">

                <button onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->

        <h2>Panel de Control</h2>
        <p>Esta es tu página base en blanco. Aquí comenzarás a construir las tablas y herramientas del administrador.</p>
