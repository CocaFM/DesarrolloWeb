<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Nombre Genérico] - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor-principal">
        <div class="caja-interfaz">
            
            <div id="menu-principal" class="seccion-activa">
                <h2 class="titulo-bienvenida">Bienvenido a [Nombre Genérico]</h2>
                <p class="subtitulo">Seleccione cómo desea ingresar:</p>
                <button onclick="mostrarLogin('administrador')">Iniciar sesión como Administrador</button>
                <button onclick="mostrarLogin('encargado')">Iniciar sesión como Encargado</button>
                <button disabled>Iniciar sesión como Cliente (No disponible)</button>
                <hr>
                <button onclick="mostrarRegistro()" class="btn-secundario">Crea tu cuenta</button>
            </div>

            <div id="seccion-login" class="seccion-oculta">
                <h3 id="titulo-login">Iniciar Sesión</h3>
                <form id="form-login" onsubmit="procesarLogin(event)">
                    <label for="correo-login">Correo electrónico:</label>
                    <input type="email" id="correo-login" required placeholder="ejemplo@correo.com">

                    <label for="password-login">Contraseña:</label>
                    <input type="password" id="password-login" required placeholder="********">

                    <input type="hidden" id="rol-login">

                    <div class="espacio-botones">
                        <button type="submit">Ingresar</button>
                        <button type="button" class="btn-secundario" onclick="volverMenu()">Volver</button>
                    </div>
                </form>
            </div>

            <div id="seccion-registro" class="seccion-oculta">
                <h2 class="titulo-bienvenida">Crea tu cuenta</h2>
                <form id="form-registro" onsubmit="procesarRegistro(event)">
                    <label for="nombre-reg">Nombre completo:</label>
                    <input type="text" id="nombre-reg" required placeholder="Tu nombre">

                    <label for="correo-reg">Correo electrónico:</label>
                    <input type="email" id="correo-reg" required placeholder="ejemplo@correo.com">

                    <label for="password-reg">Contraseña:</label>
                    <input type="password" id="password-reg" required placeholder="Crea tu contraseña">

                    <label for="confirm-password-reg">Confirmar Contraseña:</label>
                    <input type="password" id="confirm-password-reg" required placeholder="Repite tu contraseña">

                    <div class="espacio-botones">
                        <button type="submit">Registrarse</button>
                        <button type="button" class="btn-secundario" onclick="volverMenu()">Volver</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
