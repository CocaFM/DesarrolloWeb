<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCaté - Iniciar Sesión</title>
    <!-- Enlace a la hoja de estilos global -->
    <link rel="stylesheet" href="style.css">
    <!-- Carga de Alpine.js para manejar la reactividad del login -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<!-- Inicializa el componente authApp() y aplica el fondo de login -->
<body x-data="authApp()" x-cloak class="pagina-login">

    <div class="contenedor-principal">
        <div class="caja-interfaz">
            
            <!-- ========================================================== -->
            <!-- SECCIÓN 1: VISTA DE INICIO DE SESIÓN UNIFICADO             -->
            <!-- Solicita correo y clave para redirigir según el rol JSON.  -->
            <!-- ========================================================== -->
            <div x-show="vista === 'login'" x-transition>
                <h2 class="titulo-bienvenida">Bienvenido a CyberCaté</h2>
                <h3 class="subtitulo" style="margin-bottom: 20px;">Iniciar Sesión</h3>
                
                <!-- @submit.prevent evita que la página se recargue al enviar -->
                <form @submit.prevent="procesarLogin">
                    <label>Correo electrónico:</label>
                    <input type="email" x-model="loginData.correo" required placeholder="ejemplo@correo.com">

                    <label>Contraseña:</label>
                    <div class="contenedor-password">
                        <!-- Cambia dinámicamente entre 'text' y 'password' mientras presionas el ojo -->
                        <input :type="verPasswordLogin ? 'text' : 'password'" x-model="loginData.password" required placeholder="********">
                        <button 
                            type="button" 
                            class="btn-ojo-clave" 
                            title="Mantén presionado para ver la contraseña"
                            @mousedown="verPasswordLogin = true" 
                            @mouseup="verPasswordLogin = false" 
                            @mouseleave="verPasswordLogin = false"
                            @touchstart.prevent="verPasswordLogin = true" 
                            @touchend.prevent="verPasswordLogin = false">
                            <!-- Ícono SVG de Ojo -->
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                    <!-- Mensajes dinámicos de estado (Cargando / Error) -->
                    <div x-show="cargando" class="estado-alerta estado-cargando">Verificando credenciales en JSON...</div>
                    <div x-show="mensajeError" x-text="mensajeError" class="estado-alerta estado-error"></div>

                    <div class="espacio-botones">
                        <button type="submit" :disabled="cargando">Ingresar</button>
                    </div>
                </form>
                <hr>
                <button type="button" @click="mostrarRegistro()" class="btn-secundario">Crea tu cuenta</button>
            </div>

            <!-- ========================================================== -->
            <!-- SECCIÓN 2: VISTA DE REGISTRO DE NUEVOS CLIENTES            -->
            <!-- Permite crear una cuenta temporal en la memoria de sesión. -->
            <!-- ========================================================== -->
            <div x-show="vista === 'registro'" style="display: none;" x-transition>
                <h2 class="titulo-bienvenida">Crea tu cuenta</h2>
                <form @submit.prevent="procesarRegistro">
                    <label>Nombre completo:</label>
                    <input type="text" x-model="regData.nombre" required placeholder="Tu nombre">

                    <label>Correo electrónico:</label>
                    <input type="email" x-model="regData.correo" required placeholder="ejemplo@correo.com">

                    <label>Contraseña:</label>
                    <input type="password" x-model="regData.password" required placeholder="Crea tu contraseña">

                    <label>Confirmar Contraseña:</label>
                    <input type="password" x-model="regData.confirm" required placeholder="Repite tu contraseña">

                    <div x-show="mensajeError" x-text="mensajeError" class="estado-alerta estado-error"></div>

                    <div class="espacio-botones">
                        <button type="submit">Registrarse</button>
                        <button type="button" class="btn-secundario" @click="volverLogin()">Volver</button>
                    </div>
                </form>
            </div>
            
        </div>
    </div>

    <!-- ========================================================== -->
    <!-- SECCIÓN 3: BOTÓN VERDE REDONDO E IMAGEN BRUSCA (2 SEG)     -->
    <!-- ========================================================== -->
    <button 
        type="button" 
        class="btn-verde-esquina" 
        x-show="vista === 'login'" 
        @click="activarImagenTemporal()"
        title="Botón sorpresa">
    </button>

    <!-- Sin x-transition para que aparezca de golpe (bruscamente) -->
    <div class="overlay-imagen-temporal" x-show="mostrarImagenTemporal" style="display: none;">
        <img src="0_imagenes/albert.png" alt="Alberto Cangriagada">
    </div>

    <!-- Enlace al script respetando la 'I' mayúscula del archivo -->
    <script src="script_Index.js"></script>
</body>
</html>
